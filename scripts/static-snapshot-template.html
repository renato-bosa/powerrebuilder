<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PBD snapshot</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f6f8, #11151a);
      --surface: light-dark(#ffffff, #181e25);
      --surface-2: light-dark(#eef2f5, #222a33);
      --text: light-dark(#17202a, #e7edf4);
      --muted: light-dark(#607080, #9eabb8);
      --border: light-dark(#d5dde5, #34404c);
      --accent: light-dark(#1265a8, #64b5f6);
      --accent-soft: light-dark(#e3f1fc, #173a55);
      --good: light-dark(#217a43, #69d38b);
      --good-soft: light-dark(#e4f5ea, #173d27);
      --warn: light-dark(#9a5a00, #f5bd61);
      --warn-soft: light-dark(#fff1d9, #493316);
      --bad: light-dark(#a52f37, #ff8b93);
      --bad-soft: light-dark(#fde8ea, #4a2024);
      --code: light-dark(#f7f9fb, #0d1117);
      --shadow: light-dark(0 8px 22px rgba(22, 36, 50, .08), 0 8px 22px rgba(0, 0, 0, .28));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 22px;
      position: sticky; top: 0; z-index: 10;
    }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; font-weight: 650; }
    .source { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .summary-item { min-width: 112px; padding: 8px 10px; background: var(--surface-2); border-radius: 7px; }
    .summary-item strong { display: block; font-size: 17px; font-weight: 650; }
    .summary-item span { color: var(--muted); font-size: 11px; }
    .workspace { display: grid; grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); min-height: 0; }
    .sidebar {
      background: var(--surface); border-right: 1px solid var(--border); padding: 14px;
      height: calc(100vh - 120px); position: sticky; top: 120px; overflow: auto;
    }
    .filters { display: grid; gap: 9px; margin-bottom: 14px; }
    .search-wrap { position: relative; }
    .search-wrap input { padding-left: 34px; }
    .search-icon { position: absolute; left: 11px; top: 9px; color: var(--muted); pointer-events: none; }
    input, select {
      width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
      color: var(--text); padding: 8px 9px;
    }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { color: var(--muted); font-size: 11px; display: grid; gap: 4px; }
    .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .text-button { border: 0; background: transparent; color: var(--accent); padding: 3px; cursor: pointer; }
    .object-group { border-top: 1px solid var(--border); padding: 8px 0; }
    .object-button, .function-button {
      width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 6px;
    }
    .object-button { padding: 8px; display: grid; gap: 3px; }
    .object-button:hover, .function-button:hover { background: var(--surface-2); }
    .object-button.selected, .function-button.selected { background: var(--accent-soft); color: var(--text); }
    .object-name { font-weight: 650; overflow-wrap: anywhere; }
    .object-meta { color: var(--muted); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; }
    .function-list { margin-left: 10px; border-left: 1px solid var(--border); padding-left: 7px; }
    .function-button { padding: 7px 8px; display: grid; gap: 4px; }
    .function-signature { font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; overflow-wrap: anywhere; }
    .mini-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--muted); }
    .dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
    .main { min-width: 0; padding: 22px; }
    .detail { max-width: 1500px; margin: 0 auto; }
    .detail-head { display: grid; gap: 6px; margin-bottom: 14px; }
    .eyebrow { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    h2 { margin: 0; font-size: 19px; font-weight: 650; overflow-wrap: anywhere; }
    h3 { font-size: 14px; margin: 20px 0 8px; }
    .metrics { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0 16px; }
    .metric { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; background: var(--surface); }
    .metric strong { font-size: 13px; font-weight: 650; }
    .metric span { color: var(--muted); font-size: 10px; display: block; margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 650; }
    .badge.good { background: var(--good-soft); color: var(--good); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.bad { background: var(--bad-soft); color: var(--bad); }
    .badge.neutral { background: var(--surface-2); color: var(--muted); }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 0; flex-wrap: wrap; }
    .tab {
      border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 10px 12px;
      cursor: pointer; color: var(--muted);
    }
    .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    .panel { background: var(--surface); border: 1px solid var(--border); border-top: 0; padding: 14px; box-shadow: var(--shadow); }
    pre {
      margin: 0; padding: 14px; border-radius: 6px; background: var(--code); color: var(--text); overflow: auto;
      white-space: pre; tab-size: 4; font: 12px/1.55 Consolas, "Cascadia Mono", monospace;
    }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
    td code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; }
    .empty { color: var(--muted); padding: 24px 4px; text-align: center; }
    .notice { border-left: 3px solid var(--accent); padding: 8px 10px; background: var(--accent-soft); margin-bottom: 12px; font-size: 12px; }
    .notice.warn { border-color: var(--warn); background: var(--warn-soft); }
    details { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
    summary { cursor: pointer; color: var(--accent); }
    .object-overview { background: var(--surface); border: 1px solid var(--border); padding: 16px; box-shadow: var(--shadow); }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 900px) {
      .topbar { position: static; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { height: auto; max-height: 52vh; position: static; border-right: 0; border-bottom: 1px solid var(--border); }
      .main { padding: 14px; }
    }
    @media (max-width: 600px) {
      .filter-grid, .two-col { grid-template-columns: 1fr; }
      .summary-item { min-width: calc(50% - 5px); }
      .panel { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-row">
        <h1 id="app-title">PBD snapshot</h1>
        <div class="source" id="source-meta"></div>
      </div>
      <div class="summary" id="summary"></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Objetos e funções">
        <div class="filters">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label><span class="sr-only">Buscar</span><input id="search" type="search" placeholder="Buscar objeto, função ou código"></label>
          </div>
          <div class="filter-grid">
            <label>Completude<select id="completion-filter"><option value="all">Todas</option><option value="complete">Completas</option><option value="incomplete">Incompletas</option></select></label>
            <label>Unresolved<select id="unresolved-filter"><option value="all">Todos</option><option value="with">Com unresolved</option><option value="without">Sem unresolved</option></select></label>
            <label>CFG<select id="cfg-filter"><option value="all">Todos</option><option value="valid">Válido</option><option value="invalid">Inválido</option></select></label>
            <label>Tipo de objeto<select id="type-filter"><option value="all">Todos</option></select></label>
          </div>
          <div class="filter-footer"><span id="visible-count"></span><button class="text-button" id="reset-filters" type="button">Limpar filtros</button></div>
        </div>
        <nav id="object-nav"></nav>
      </aside>
      <main class="main"><div class="detail" id="detail"></div></main>
    </div>
  </div>

  <script id="snapshot-data" type="application/json">__DECODE_REPORT_JSON__</script>
  <script>
    (() => {
      'use strict';
      const report = JSON.parse(document.getElementById('snapshot-data').textContent);
      const entries = (report.entries || []).map((entry, entryIndex) => ({ ...entry, entryIndex }));
      const state = { search: '', completion: 'all', unresolved: 'all', cfg: 'all', type: 'all', entryIndex: null, regionIndex: null, tab: 'powerscript' };
      const nav = document.getElementById('object-nav');
      const detail = document.getElementById('detail');

      const esc = value => String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      const json = value => esc(JSON.stringify(value ?? null, null, 2));
      const hex = value => Number.isFinite(Number(value)) ? `0x${Number(value).toString(16).toUpperCase().padStart(4, '0')}` : '—';
      const percent = value => Number.isFinite(Number(value)) ? `${Number(value).toFixed(2)}%` : '—';
      const basename = path => String(path || '').replaceAll('\\', '/').split('/').pop() || 'PBD';
      const previewOf = region => region && region.semantic_preview ? region.semantic_preview : null;
      const functionsOf = entry => entry.pcode_regions || [];
      const unresolvedCount = region => (previewOf(region)?.unresolved || []).length;
      const complete = region => previewOf(region)?.semantically_complete === true;
      const cfgValid = region => previewOf(region)?.control_flow?.valid === true;
      const objectType = entry => entry.object_type || entry.format?.kind || 'unknown';
      const safeLower = value => String(value || '').toLocaleLowerCase('pt-BR');
      const stableValue = value => JSON.stringify(value, Object.keys(value || {}).sort());

      const constantGroups = new Map();
      entries.forEach(entry => (entry.compiled_constants || []).forEach(constant => {
        const key = `${safeLower(constant.owner_type_name)}\u001f${constant.type_ref}\u001f${stableValue(constant.value)}`;
        const identity = `${safeLower(constant.owner_type_name)}\u001f${safeLower(constant.name)}\u001f${constant.type_ref}\u001f${constant.raw_value}\u001f${stableValue(constant.value)}`;
        if (!constantGroups.has(key)) constantGroups.set(key, new Map());
        constantGroups.get(key).set(identity, constant);
      }));

      function constantEvidence(constant) {
        const key = `${safeLower(constant.owner_type_name)}\u001f${constant.type_ref}\u001f${stableValue(constant.value)}`;
        const candidates = [...(constantGroups.get(key)?.values() || [])];
        return { status: candidates.length === 1 ? 'unique' : 'ambiguous', candidates };
      }

      function constantValue(constant) {
        const value = constant?.value;
        if (!value) return 'unresolved';
        if (value.kind === 'string') return `"${value.value}"`;
        return String(value.value ?? value.kind);
      }

      function reportHeader() {
        const source = report.source || {};
        document.title = `${basename(source.path)} — PBD snapshot`;
        document.getElementById('app-title').textContent = `${basename(source.path)} — snapshot navegável`;
        document.getElementById('source-meta').textContent = `report v${report.report_version ?? '?'} · PB ${source.powerbuilder_runtime || 'desconhecido'} · ${source.path || ''}`;
        const s = report.summary || {};
        const values = [
          [s.object_containers ?? entries.length, 'objetos'],
          [s.semantic_previews ?? entries.reduce((n, e) => n + functionsOf(e).length, 0), 'funções'],
          [s.semantically_complete_previews ?? 0, 'semanticamente completas'],
          [percent(s.semantic_coverage_percent), 'cobertura de instruções'],
          [s.reconstructed_exception_regions ?? 0, 'regiões de exceção']
        ];
        document.getElementById('summary').innerHTML = values.map(([value, label]) => `<div class="summary-item"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`).join('');
      }

      function populateTypes() {
        const select = document.getElementById('type-filter');
        [...new Set(entries.map(objectType))].sort().forEach(type => {
          const option = document.createElement('option'); option.value = type; option.textContent = type; select.appendChild(option);
        });
      }

      function functionHaystack(entry, region) {
        const p = previewOf(region);
        return safeLower([
          entry.name, entry.object_type, region.owner, region.object_type_name, p?.signature,
          p?.powerscript_like, ...(p?.unresolved || []).map(item => `${item.mnemonic} ${item.reason}`),
          ...(region.scan?.instructions || []).map(item => item.mnemonic)
        ].join(' '));
      }

      function matchesFilters(entry, region, objectNameMatches = false) {
        const p = previewOf(region);
        if (!p) return false;
        if (state.type !== 'all' && objectType(entry) !== state.type) return false;
        if (state.completion === 'complete' && !complete(region)) return false;
        if (state.completion === 'incomplete' && complete(region)) return false;
        if (state.unresolved === 'with' && unresolvedCount(region) === 0) return false;
        if (state.unresolved === 'without' && unresolvedCount(region) > 0) return false;
        if (state.cfg === 'valid' && !cfgValid(region)) return false;
        if (state.cfg === 'invalid' && cfgValid(region)) return false;
        return !state.search || objectNameMatches || functionHaystack(entry, region).includes(state.search);
      }

      function renderNav() {
        let functionCount = 0;
        let objectCount = 0;
        const groups = [];
        entries.forEach(entry => {
          if (state.type !== 'all' && objectType(entry) !== state.type) return;
          const objectNameMatches = !state.search || safeLower(`${entry.name} ${entry.object_type} ${entry.structural_status}`).includes(state.search);
          const regions = functionsOf(entry).filter(region => matchesFilters(entry, region, objectNameMatches));
          const noFunctionObjectMatches = functionsOf(entry).length === 0 && objectNameMatches && state.completion === 'all' && state.unresolved === 'all' && state.cfg === 'all';
          if (!regions.length && !noFunctionObjectMatches) return;
          objectCount += 1; functionCount += regions.length;
          const selectedObject = state.entryIndex === entry.entryIndex && state.regionIndex === null;
          const incomplete = functionsOf(entry).filter(region => !complete(region)).length;
          const functions = regions.map(region => {
            const p = previewOf(region);
            const selected = state.entryIndex === entry.entryIndex && state.regionIndex === region.region_index;
            return `<button type="button" class="function-button${selected ? ' selected' : ''}" data-entry="${entry.entryIndex}" data-region="${region.region_index}">
              <span class="function-signature">${esc(p.signature || region.owner)}</span>
              <span class="mini-meta"><span class="dot ${complete(region) ? 'good' : 'warn'}"></span>${percent(p.semantic_coverage_percent)} · ${unresolvedCount(region)} unresolved · CFG ${cfgValid(region) ? 'válido' : 'inválido'}</span>
            </button>`;
          }).join('');
          groups.push(`<section class="object-group">
            <button type="button" class="object-button${selectedObject ? ' selected' : ''}" data-entry="${entry.entryIndex}" data-object="true">
              <span class="object-name">${esc(entry.name)}</span>
              <span class="object-meta"><span>${esc(objectType(entry))}</span><span>${functionsOf(entry).length} funções</span><span>${incomplete} incompletas</span><span>${(entry.compiled_constants || []).length} constantes</span></span>
            </button>
            ${functions ? `<div class="function-list">${functions}</div>` : ''}
          </section>`);
        });
        nav.innerHTML = groups.length ? groups.join('') : '<div class="empty">Nenhum item corresponde aos filtros.</div>';
        document.getElementById('visible-count').textContent = `${objectCount} objetos · ${functionCount} funções visíveis`;
        nav.querySelectorAll('[data-entry]').forEach(button => button.addEventListener('click', () => {
          state.entryIndex = Number(button.dataset.entry);
          state.regionIndex = button.dataset.object ? null : Number(button.dataset.region);
          state.tab = 'powerscript'; renderNav(); renderDetail();
        }));
      }

      function badge(text, kind) { return `<span class="badge ${kind}">${esc(text)}</span>`; }
      function metric(value, label) { return `<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`; }
      function constantsTable(constants) {
        if (!constants?.length) return '<div class="empty">Nenhuma constante compilada declarada neste objeto.</div>';
        return `<div class="notice">Evidência do catálogo do objeto. Estes itens não afirmam que a função selecionada usa a constante.</div>
          <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Valor compilado</th><th>Raw</th><th>Resolução</th><th>Candidatos</th></tr></thead><tbody>${constants.map(constant => {
            const evidence = constantEvidence(constant);
            return `<tr><td><code>${esc(constant.name)}</code></td><td>${esc(constant.type_name)}</td><td><code>${esc(constantValue(constant))}</code></td><td><code>${hex(constant.raw_value)}</code></td><td>${badge(evidence.status, evidence.status === 'unique' ? 'good' : 'warn')}</td><td>${esc(evidence.candidates.map(item => item.name).join(', '))}</td></tr>`;
          }).join('')}</tbody></table></div>`;
      }

      function renderObject(entry) {
        const constants = entry.compiled_constants || [];
        detail.innerHTML = `<div class="detail-head"><div class="eyebrow">Objeto #${entry.entryIndex} · ${esc(objectType(entry))}</div><h2>${esc(entry.name)}</h2></div>
          <div class="metrics">${metric(functionsOf(entry).length, 'funções')}${metric(constants.length, 'constantes compiladas')}${metric(entry.size ?? '—', 'bytes')}${metric(entry.structural_status || '—', 'status estrutural')}</div>
          <section class="object-overview"><h3>Constantes compiladas</h3>${constantsTable(constants)}
          <details><summary>Definições e formato do objeto</summary><pre><code>${json({ format: entry.format, object_definitions: entry.object_definitions, enum_values: entry.enum_values })}</code></pre></details></section>`;
      }

      function renderPowerScript(region) {
        const p = previewOf(region);
        return `<pre aria-label="PowerScript reconstruído"><code>${esc(p.powerscript_like || '')}</code></pre>`;
      }

      function renderPCode(region) {
        const scan = region.scan || {};
        const instructions = scan.instructions || [];
        const rows = instructions.map(item => `<tr><td><code>${hex(item.offset)}</code></td><td><code>${hex(item.opcode)}</code></td><td><code>${esc(item.mnemonic)}</code></td><td><code>${esc((item.operands_u16_le || []).join(', '))}</code></td><td><code>${esc(item.operand_bytes_hex || '')}</code></td></tr>`).join('');
        return `<div class="metrics">${metric(scan.instruction_count ?? instructions.length, 'instruções')}${metric(scan.consumed_bytes ?? '—', 'bytes consumidos')}${metric(scan.complete ? 'sim' : 'não', 'scan completo')}${metric((scan.branch_targets || []).length, 'branch targets')}</div>
          <div class="table-wrap"><table><thead><tr><th>Offset</th><th>Opcode</th><th>Mnemonic</th><th>Operandos u16</th><th>Bytes</th></tr></thead><tbody>${rows}</tbody></table></div>
          <details><summary>Branch targets e estado do scanner</summary><pre><code>${json({ branch_targets: scan.branch_targets, stop: scan.stop, debug_map_validation: region.debug_map_validation })}</code></pre></details>`;
      }

      function renderControlFlow(region) {
        const flow = previewOf(region).control_flow || {};
        const blocks = (flow.blocks || []).map(block => `<tr><td>${esc(block.id)}</td><td><code>${hex(block.start_offset)}</code></td><td><code>${hex(block.end_offset_exclusive)}</code></td><td><code>${esc((block.instruction_offsets || []).map(hex).join(', '))}</code></td></tr>`).join('');
        const edges = (flow.edges || []).map(edge => `<tr><td>${esc(edge.from_block)}</td><td>${esc(edge.kind)}</td><td>${esc(edge.to_block)}</td></tr>`).join('');
        return `${flow.valid ? '' : `<div class="notice warn">CFG marcado como inválido pelo pipeline: ${esc((flow.errors || []).join('; '))}</div>`}
          <div class="two-col"><section><h3>Blocos</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Início</th><th>Fim</th><th>Offsets de instrução</th></tr></thead><tbody>${blocks}</tbody></table></div></section>
          <section><h3>Arestas</h3><div class="table-wrap"><table><thead><tr><th>Origem</th><th>Tipo</th><th>Destino</th></tr></thead><tbody>${edges}</tbody></table></div></section></div>
          <h3>Regiões de exceção do CFG</h3>${(flow.exception_regions || []).length ? `<pre><code>${json(flow.exception_regions)}</code></pre>` : '<div class="empty">Nenhuma região de exceção registrada.</div>'}`;
      }

      function renderEvidence(entry, region) {
        const p = previewOf(region);
        const unresolved = p.unresolved || [];
        const unresolvedRows = unresolved.map(item => `<tr><td><code>${hex(item.offset)}</code></td><td><code>${hex(item.opcode)}</code></td><td><code>${esc(item.mnemonic)}</code></td><td>${esc(item.reason)}</td></tr>`).join('');
        return `<h3>Unresolved</h3>${unresolved.length ? `<div class="table-wrap"><table><thead><tr><th>Offset</th><th>Opcode</th><th>Mnemonic</th><th>Motivo</th></tr></thead><tbody>${unresolvedRows}</tbody></table></div>` : '<div class="empty">Nenhuma instrução unresolved.</div>'}
          <div class="two-col"><section><h3>Reconstructed ifs</h3>${p.reconstructed_ifs?.length ? `<pre><code>${json(p.reconstructed_ifs)}</code></pre>` : '<div class="empty">Nenhum if reconstruído.</div>'}</section>
          <section><h3>Try/catch structures</h3>${p.try_catch_structures?.length ? `<pre><code>${json(p.try_catch_structures)}</code></pre>` : '<div class="empty">Nenhuma estrutura try/catch reconstruída.</div>'}</section></div>
          <h3>Constantes compiladas do objeto</h3>${constantsTable(entry.compiled_constants || [])}
          <details><summary>Evidência semântica completa</summary><pre><code>${json(p.evidence)}</code></pre></details>
          <details><summary>Definição, variáveis e referências compiladas</summary><pre><code>${json({ definition: region.definition, variables: region.variables, global_variables: region.global_variables, referenced_functions: region.referenced_functions })}</code></pre></details>`;
      }

      function panelContent(entry, region) {
        if (state.tab === 'pcode') return renderPCode(region);
        if (state.tab === 'flow') return renderControlFlow(region);
        if (state.tab === 'evidence') return renderEvidence(entry, region);
        return renderPowerScript(region);
      }

      function renderDetail() {
        const entry = entries.find(item => item.entryIndex === state.entryIndex) || entries[0];
        if (!entry) { detail.innerHTML = '<div class="empty">Relatório sem objetos.</div>'; return; }
        if (state.regionIndex === null) { renderObject(entry); return; }
        const region = functionsOf(entry).find(item => item.region_index === state.regionIndex) || functionsOf(entry)[0];
        if (!region) { renderObject(entry); return; }
        const p = previewOf(region);
        const tabs = [['powerscript', 'PowerScript'], ['pcode', 'P-code'], ['flow', 'Control Flow'], ['evidence', 'Evidence']];
        detail.innerHTML = `<div class="detail-head"><div class="eyebrow">${esc(entry.name)} · região ${region.region_index} · função ${region.function_index}</div><h2>${esc(p.signature || region.owner)}</h2></div>
          <div class="metrics">
            ${metric(p.instruction_count, 'instruction count')}${metric(`${p.supported_instruction_count}/${p.instruction_count}`, 'instruções suportadas')}${metric(percent(p.semantic_coverage_percent), 'semantic coverage')}
            ${metric(p.semantically_complete ? 'sim' : 'não', 'semantically_complete')}${metric(p.control_flow?.valid ? 'sim' : 'não', 'CFG válido')}${metric((p.reconstructed_ifs || []).length, 'reconstructed_ifs')}
            ${metric((p.try_catch_structures || []).length, 'try_catch_structures')}${metric((p.unresolved || []).length, 'unresolved')}
          </div>
          <div class="tabs" role="tablist" aria-label="Visões da função">${tabs.map(([id, label]) => `<button type="button" class="tab" role="tab" data-tab="${id}" aria-selected="${state.tab === id}">${label}</button>`).join('')}</div>
          <section class="panel" role="tabpanel">${panelContent(entry, region)}</section>`;
        detail.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => { state.tab = button.dataset.tab; renderDetail(); }));
      }

      function bindFilters() {
        const bindings = [['completion-filter', 'completion'], ['unresolved-filter', 'unresolved'], ['cfg-filter', 'cfg'], ['type-filter', 'type']];
        bindings.forEach(([id, key]) => document.getElementById(id).addEventListener('change', event => { state[key] = event.target.value; renderNav(); }));
        document.getElementById('search').addEventListener('input', event => { state.search = safeLower(event.target.value.trim()); renderNav(); });
        document.getElementById('reset-filters').addEventListener('click', () => {
          state.search = ''; state.completion = 'all'; state.unresolved = 'all'; state.cfg = 'all'; state.type = 'all';
          document.getElementById('search').value = '';
          bindings.forEach(([id, key]) => { document.getElementById(id).value = state[key]; });
          renderNav();
        });
      }

      reportHeader(); populateTypes(); bindFilters();
      const firstEntry = entries.find(entry => functionsOf(entry).length) || entries[0];
      state.entryIndex = firstEntry?.entryIndex ?? null;
      state.regionIndex = functionsOf(firstEntry || {})[0]?.region_index ?? null;
      renderNav(); renderDetail();
    })();
  </script>
</body>
</html>
