[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sime-finch"
version = "0.1.0"
authors = [{ name = "Michael", email = "mprowacki@gmail.com" }]
description = "PowerBuilder model and parser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core dependencies
    "lark>=1.2.2",
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "sqlmodel>=0.0.22",
    "click>=8.1.7",
    # Enhanced extraction
    "chardet>=5.2.0",
    "python-magic>=0.4.27",
    "pillow>=10.0.0",
    # Progress and output
    "tqdm>=4.67.1",
    "rich>=13.7.1",
    "psutil>=6.1.1",
    # Async I/O
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
distributed = [
    "celery>=5.3.0",
    "ray>=2.9.0",
]

[project.scripts]
sime-finch = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/parse/grammar" = "src/parse/grammar"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
respect-gitignore = true
show-fixes = true

[tool.ruff.lint]
# Comprehensive rule set optimized for compatibility between linter and formatter
select = [
    "ALL", # Enable all rules, then exclude specific ones below
]
ignore = [
    # Formatter conflicts - these rules conflict with ruff format
    "COM812",
    "COM819", # Trailing comma rules (formatter handles this)
    "ISC001",
    "ISC002", # String concatenation (formatter handles this)
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",   # Quote style (formatter handles this)
    "W191",   # Tab indentation (formatter handles this)
    "E111",
    "E114",
    "E117",   # Indentation (formatter handles this)
    "E501",   # Line too long (formatter handles this)

    # Overly strict rules  
    "D203",
    "D213",    # Conflicting docstring rules
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison

    # Noisy rules for existing codebase
    "EM101",
    "EM102",
    "EM103",  # Exception message formatting
    "TRY400", # Use except Exception instead of BaseException
    "RUF010", # Explicit f-string type conversion
    "F403",
    "F405",   # Star imports (legacy code)
    
    # Temporarily disabled for large codebase cleanup
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for special method
    "BLE001", # Do not catch blind exception
    "C901",   # Complex structure
    "FBT001", # Boolean type hint positional argument
    "FBT002", # Boolean default value positional argument
    "PTH123", # Use pathlib instead of builtin open
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "S603",   # subprocess call without shell=True
    "S110",   # try-except-pass
    "INP001", # implicit namespace package
    "D107",   # Missing docstring in public init
    "D103",   # Missing docstring in public function
    "D102",   # Missing docstring in public method
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
# Stable formatting for Python 3.13
preview = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "ANN201",  # Missing return type annotation
    "PLR2004", # Magic value used in comparison
    "D",       # Docstring rules
    "SLF001",  # Private member accessed
    "PLR0913", # Too many arguments
    "ARG001",  # Unused function argument
    "FBT001",
    "FBT002",  # Boolean arguments
]
"scripts/**/*.py" = [
    "T201",    # Print statements allowed in scripts
    "S101",    # Use of assert
    "D",       # Docstring rules
    "PLR0913", # Too many arguments
    "ANN",     # Type annotations
]
"**/__init__.py" = [
    "D104", # Missing docstring in public package
    "F401", # Unused import (re-exports)
]
# Utility and analysis scripts
"**/detect_*.py" = [
    "T201",    # Print statements for output
    "ANN",     # Type annotations
    "D",       # Docstring rules
    "PLR0913", # Too many arguments
    "S603",    # Subprocess calls
    "PTH123",  # Use pathlib
    "BLE001",  # Catch exceptions
]
"**/validate_*.py" = [
    "T201",    # Print statements for output
    "ANN",     # Type annotations
    "D",       # Docstring rules
    "PTH123",  # Use pathlib
    "S603",    # Subprocess calls
    "BLE001",  # Catch exceptions
    "EXE001",  # Shebang executable
]
"**/fix_*.py" = [
    "T201",    # Print statements for output
    "ANN",     # Type annotations
    "D",       # Docstring rules
    "ALL",     # Temporary scripts with relaxed rules
]
"profile_*.py" = [
    "T201",    # Print statements for output
    "ANN",     # Type annotations
    "D",       # Docstring rules
    "PTH123",  # Use pathlib
    "S603",    # Subprocess calls
]
"memory_profiling_test.py" = [
    "ALL",     # Testing/profiling script with relaxed rules
]
"examples/**/*.py" = [
    "T201",    # Print statements for demos
    "ANN",     # Type annotations
    "D",       # Docstring rules
    "PLR0913", # Too many arguments
    "S101",    # Assert statements in examples
    "PTH123",  # Use pathlib
]
"tools/**/*.py" = [
    "T201",    # Print statements for tools
    "ANN",     # Type annotations
    "D",       # Docstring rules
    "PTH123",  # Use pathlib
    "S603",    # Subprocess calls
    "BLE001",  # Catch exceptions
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "C901",    # Complex structure
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
exclude = ["reference/", "scripts/", "tests/", "benchmarks/", "backup_before_rename/"]

# Gradual typing settings (less strict than before)
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = false

# Allow gradual typing
allow_untyped_globals = true
allow_redefinition = true

# Ignore missing imports
ignore_missing_imports = true

# Plugins
plugins = ["pydantic.mypy"]

# Per-module options for stricter checking
[[tool.mypy.overrides]]
module = "src.common.*"
disallow_untyped_defs = false
warn_no_return = true

[[tool.mypy.overrides]]
module = "src.model.ast.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["lark.*", "psutil.*", "rich.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
# TODO: Re-enable when test coverage is improved
# fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."] # Fixed from python_paths
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--maxfail=5",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "ast: AST node tests",
    "expressions: Expression node tests",
    "statements: Statement node tests",
    "types: Type node tests",
    "sql: SQL node tests",
    "events: Event node tests",
    "model: Model object tests",
    "parse: Parser and grammar tests",
    "app: Application and API tests",
    "utils: Utility and helper tests",
    "hypothesis: Property-based tests using Hypothesis",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# UV-specific configuration optimized for performance
index-strategy = "unsafe-best-match"
resolution = "highest"
index-url = "https://pypi.org/simple"
# Ensure UV manages Python version from .python-version
python-preference = "only-managed"

# Note: User-specific settings should remain in .uvrc or UV config files:
# - python-path = ".uv/pythons" (system-specific path)
# - global.venvs-dir = "${HOME}/.cache/uv/venvs" (user home directory)
# - global.cache-dir = "${HOME}/.cache/uv/cache" (user home directory)

dev-dependencies = [
    # Testing Framework
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-sugar>=1.0.0",
    "pytest-clarity>=1.0.1",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=4.0.0",
    # Property-based Testing
    "hypothesis>=6.112.0",
    "hypothesis-jsonschema>=0.23.1",
    # Snapshot Testing
    "syrupy>=4.6.1",
    # Test Data Generation
    "factory-boy>=3.3.1",
    "mimesis>=17.0.0",
    "faker>=37.0.0",
    # Code Quality & Type Checking
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyright>=1.1.391",
    "vulture>=2.14",
    "coverage>=7.6.0",
    "coverage-badge>=1.1.2",
    # Type Stubs
    "types-setuptools>=75.0.0",
    "types-pyyaml>=6.0.12",
    "types-click>=7.1.8",
    "types-tqdm>=4.66.0",
    "types-python-dateutil>=2.9.0",
    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.50",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-section-index>=0.3.9",
    # Development Tools
    "libcst>=1.5.0",
    "pre-commit>=4.0.1",
    "ipython>=8.30.0",
    "ipdb>=0.13.13",
    "rich>=13.9.4",
    "watchdog>=6.0.0",
    "nox>=2024.4.15",
    "memory-profiler>=0.61.0",
    "responses>=0.25.7",
    "pytest-timeout>=2.4.0",
    "pytest-repeat>=0.9.4",
    "httpx>=0.28.1",
]

[tool.vulture]
# Vulture configuration for detecting dead code
paths = ["src/", "config/vulture_whitelist.py"]
min_confidence = 80
sort_by_size = true
verbose = false
ignore_names = [
    # Common unused function parameters
    "args",
    "kwargs",
    "self",
    "cls",
    # Parser/transformer parameters
    "items",
    "children",
    "meta",
    "ctx",
    "context",
    # Token parameters
    "*_token",
    "*_kw",
    "lparen*",
    "rparen*",
    "lbrace*",
    "rbrace*",
    "comma*",
    "semicolon*",
    # Protocol/interface parameters
    "other",
    "exc_type",
    "exc_value",
    "traceback",
    # Visitor pattern
    "node",
    "visit_*",
    # Dynamic/framework methods
    "on_*",
    "before_*",
    "after_*",
    "pre_*",
    "post_*",
]
ignore_decorators = [
    "@property",
    "@cached_property",
    "@abstractmethod",
    "@staticmethod",
    "@classmethod",
    "@dataclass",
    "@contextmanager",
]
exclude = [
    "tests/",
    "tools/",
    "archive/",
    "data/",
    "docs/",
    "reference/",
    "*.pyi",
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "No circular dependency between Parse and Model"
type = "forbidden"
source_modules = ["src.parse"]
forbidden_modules = ["src.model"]
ignore_imports = [
    "src.parse.library -> src.model.ast.serialization",
    "src.parse.transformer.ast_builder -> src.model"
]

[[tool.importlinter.contracts]]
name = "Layer architecture enforcement"
type = "layers"
layers = [
    "src.common",
    "src.extract", 
    "src.decompile",
    "src.parse",
    "src.model",
    "src.generate"
]

[tool.deptry]
# Deptry configuration for dependency hygiene
# Treat 'src' as first party module
known_first_party = ["src"]
# Map package names to module names
package_module_name_map = {"pillow" = "PIL"}
# Skip these files/directories
exclude = [
    "tests",
    "scripts", 
    "data",
    "docs",
    "reference",
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Darwin"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportGeneralTypeIssues = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportTypedDictNotRequiredAccess = true
reportPrivateImportUsage = true
reportUnboundVariable = true
reportUnsupportedDunderAll = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportAssertAlwaysTrue = true
reportSelfClsParameterName = true
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUndefinedVariable = true
reportIncompatibleMethodOverride = true
include = [
    "src",
    "main.py",
]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.hypothesis]
# Hypothesis settings for property-based testing
max_examples = 100
deadline = 2000                        # ms
print_blob = true
verbosity = "verbose"
database_file = ".hypothesis/examples"

[tool.factory_boy]
# Factory Boy settings
use_strategy = "create"

[dependency-groups]
dev = [
    "hypothesis>=6.136.2",
    "jinja2>=3.1.6",
    "lark>=1.2.2",
    "mimesis>=18.0.0",
]

[tool.uv.sources]
# Package sources can be specified here if needed
# e.g., my-package = { git = "https://github.com/user/repo" }