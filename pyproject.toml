[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sime-finch"
version = "0.1.0"
authors = [{ name = "Michael", email = "mprowacki@gmail.com" }]
description = "PowerBuilder model and parser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core dependencies
    "lark>=1.2.2",
    "jinja2>=3.1.4",
    "sqlmodel>=0.0.22",
    "litestar>=2.12.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.32.0",
    "click>=8.1.7",
    # Enhanced extraction
    "chardet>=5.2.0",
    "python-magic>=0.4.27",
    # Static analysis
    "networkx>=3.4.2",
    "graphviz>=0.20.3",
    "matplotlib>=3.9.2",
    # Logging
    "structlog>=24.5.0",
    "python-json-logger>=2.0.7",
    # Additional dependencies
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "alembic>=1.14.0",
    "strawberry-graphql>=0.247.0",
    "astunparse>=1.6.3",
    "typing-extensions>=4.12.2",
    "tqdm>=4.67.1",
    "rich>=13.7.1",
]


[project.scripts]
sime-finch = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["parse", "model", "extract", "decompile", "generate"]

[tool.hatch.build.targets.wheel.force-include]
"parse/grammar" = "parse/grammar"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
respect-gitignore = true
show-fixes = true

[tool.ruff.lint]
# Comprehensive rule set optimized for compatibility between linter and formatter
select = [
    "ALL", # Enable all rules, then exclude specific ones below
]
ignore = [
    # Formatter conflicts - these rules conflict with ruff format
    "COM812",
    "COM819", # Trailing comma rules (formatter handles this)
    "ISC001",
    "ISC002", # String concatenation (formatter handles this)
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",   # Quote style (formatter handles this)
    "W191",   # Tab indentation (formatter handles this)
    "E111",
    "E114",
    "E117",   # Indentation (formatter handles this)
    "E501",   # Line too long (formatter handles this)

    # Overly strict rules  
    "D203",
    "D213",    # Conflicting docstring rules
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison

    # Noisy rules for existing codebase
    "EM101",
    "EM102",
    "EM103",  # Exception message formatting
    "TRY400", # Use except Exception instead of BaseException
    "RUF010", # Explicit f-string type conversion
    "F403",
    "F405",   # Star imports (legacy code)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
# Stable formatting for Python 3.13
preview = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["parse", "model", "extract", "decompile", "generate"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "ANN201",  # Missing return type annotation
    "PLR2004", # Magic value used in comparison
    "D",       # Docstring rules
    "SLF001",  # Private member accessed
    "PLR0913", # Too many arguments
    "ARG001",  # Unused function argument
    "FBT001",
    "FBT002",  # Boolean arguments
]
"scripts/**/*.py" = [
    "T201",    # Print statements allowed in scripts
    "S101",    # Use of assert
    "D",       # Docstring rules
    "PLR0913", # Too many arguments
    "ANN",     # Type annotations
]
"**/__init__.py" = [
    "D104", # Missing docstring in public package
    "F401", # Unused import (re-exports)
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["parse", "model", "extract", "decompile", "generate"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
# TODO: Re-enable when test coverage is improved
# fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]  # Fixed from python_paths
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=parse",
    "--cov=model", 
    "--cov=extract",
    "--cov=decompile",
    "--cov=generate",
    "--cov=common",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    # TODO: Re-enable when test coverage is improved
    # "--cov-fail-under=80",
    "-n=auto",  # Use pytest-xdist for parallel execution
    "--dist=worksteal",  # Better work distribution
    "--tb=short",
    "--maxfail=5",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "ast: AST node tests",
    "expressions: Expression node tests",
    "statements: Statement node tests",
    "types: Type node tests",
    "sql: SQL node tests",
    "events: Event node tests",
    "model: Model object tests",
    "parse: Parser and grammar tests",
    "app: Application and API tests",
    "utils: Utility and helper tests",
    "hypothesis: Property-based tests using Hypothesis",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# UV-specific configuration optimized for performance
index-strategy = "unsafe-best-match"
resolution = "highest"
# Ensure UV manages Python version from .python-version
python-preference = "only-managed"

dev-dependencies = [
    # Testing Framework
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-sugar>=1.0.0",
    "pytest-clarity>=1.0.1",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=4.0.0",
    # Property-based Testing
    "hypothesis>=6.112.0",
    "hypothesis-jsonschema>=0.23.1",
    # Test Data Generation
    "factory-boy>=3.3.1",
    "mimesis>=17.0.0",
    "faker>=37.0.0",
    # Code Quality & Type Checking
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyright>=1.1.391",
    "coverage>=7.6.0",
    "coverage-badge>=1.1.2",
    # Type Stubs
    "types-setuptools>=75.0.0",
    "types-pyyaml>=6.0.12",
    "types-click>=7.1.8",
    "types-tqdm>=4.66.0",
    "types-python-dateutil>=2.9.0",
    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.50",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-section-index>=0.3.9",
    # Development Tools
    "libcst>=1.5.0",
    "pre-commit>=4.0.1",
    "ipython>=8.30.0",
    "ipdb>=0.13.13",
    "rich>=13.9.4",
    "watchdog>=6.0.0",
    "black>=25.1.0",
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Darwin"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportGeneralTypeIssues = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportTypedDictNotRequiredAccess = true
reportPrivateImportUsage = true
reportUnboundVariable = true
reportUnsupportedDunderAll = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportAssertAlwaysTrue = true
reportSelfClsParameterName = true
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUndefinedVariable = true
reportIncompatibleMethodOverride = true
include = ["parse", "model", "extract", "decompile", "generate", "common", "main.py"]
exclude = ["**/__pycache__", "build", "dist", ".venv", "venv", "htmlcov", ".pytest_cache", ".mypy_cache"]

[tool.hypothesis]
# Hypothesis settings for property-based testing
max_examples = 100
deadline = 2000  # ms
print_blob = true
verbosity = "verbose"
database_file = ".hypothesis/examples"

[tool.factory_boy]
# Factory Boy settings
use_strategy = "create"

[tool.uv.sources]
# Package sources can be specified here if needed
# e.g., my-package = { git = "https://github.com/user/repo" }
