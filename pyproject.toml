[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sime-finch"
version = "0.1.0"
authors = [{ name = "Michael", email = "mprowacki@gmail.com" }]
description = "PowerBuilder model and parser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core dependencies
    "lark>=1.2.2",
    "jinja2>=3.1.4",
    "sqlmodel>=0.0.22",
    "litestar>=2.12.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.32.0",
    "click>=8.1.7",
    # Enhanced extraction
    "chardet>=5.2.0",
    "python-magic>=0.4.27",
    # Static analysis
    "networkx>=3.4.2",
    "graphviz>=0.20.3",
    "matplotlib>=3.9.2",
    # Logging
    "structlog>=24.5.0",
    "python-json-logger>=2.0.7",
    # Additional dependencies
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "alembic>=1.14.0",
    "strawberry-graphql>=0.247.0",
    "astunparse>=1.6.3",
    "typing-extensions>=4.12.2",
    "tqdm>=4.67.1",
    "rich>=13.7.1",
]


[project.scripts]
sime-finch = "main:cli"

[tool.hatch.build.targets.wheel]
packages = [
    "parse",
    "model",
    "extract",
    "decompile",
    "generate",
]

[tool.hatch.build.targets.wheel.force-include]
"parse/grammar" = "parse/grammar"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
respect-gitignore = true
show-fixes = true

[tool.ruff.lint]
# Comprehensive rule set optimized for compatibility between linter and formatter
select = [
    "ALL",  # Enable all rules, then exclude specific ones below
]
ignore = [
    # Formatter conflicts - these rules conflict with ruff format
    "COM812", "COM819",  # Trailing comma rules (formatter handles this)
    "ISC001", "ISC002",  # String concatenation (formatter handles this)
    "Q000", "Q001", "Q002", "Q003", "Q004",  # Quote style (formatter handles this)
    "W191",    # Tab indentation (formatter handles this)
    "E111", "E114", "E117",  # Indentation (formatter handles this)
    "E501",    # Line too long (formatter handles this)
    
    # Documentation - relaxed for development
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # Missing docstrings
    
    # Development-friendly ignores
    "FIX002",  # Line contains TODO
    "TD002", "TD003",  # Missing TODO details
    "T201",    # Print statements (useful for debugging)
    "S101",    # Use of assert (useful for testing)
    
    # Overly strict rules  
    "D203", "D213",      # Conflicting docstring rules
    "PLR0913",           # Too many arguments
    "PLR2004",           # Magic value comparison
    
    # Noisy rules for existing codebase
    "EM101", "EM102", "EM103",  # Exception message formatting
    "TRY400",            # Use except Exception instead of BaseException
    "RUF010",            # Explicit f-string type conversion
    "F403", "F405",      # Star imports (legacy code)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
# Stable formatting for Python 3.13
preview = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["parse", "model", "extract", "decompile", "generate"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Use of assert
    "ANN201",   # Missing return type annotation
    "PLR2004",  # Magic value used in comparison
    "D",        # Docstring rules
    "SLF001",   # Private member accessed
    "PLR0913",  # Too many arguments
    "ARG001",   # Unused function argument
    "FBT001", "FBT002",  # Boolean arguments
]
"scripts/**/*.py" = [
    "T201",     # Print statements allowed in scripts
    "S101",     # Use of assert
    "D",        # Docstring rules
    "PLR0913",  # Too many arguments
    "ANN",      # Type annotations
]
"**/__init__.py" = [
    "D104",     # Missing docstring in public package
    "F401",     # Unused import (re-exports)
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["parse", "model", "extract", "decompile", "generate"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_paths = ["."]
addopts = "-ra --strict-markers --strict-config --cov --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "ast: AST node tests",
    "expressions: Expression node tests",
    "statements: Statement node tests",
    "types: Type node tests",
    "sql: SQL node tests",
    "events: Event node tests",
    "model: Model object tests",
    "parse: Parser and grammar tests",
    "app: Application and API tests",
    "utils: Utility and helper tests",
]

[tool.uv]
# UV-specific configuration optimized for performance
index-strategy = "unsafe-best-match"
resolution = "highest"

dev-dependencies = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-sugar>=1.0.0",
    "pytest-clarity>=1.0.1",
    "hypothesis>=6.112.0",
    # Code quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "coverage>=7.6.0",
    "types-setuptools>=75.0.0",
    "libcst>=1.5.0",
    # Documentation
    "sphinx>=8.1.0",
    "sphinx-rtd-theme>=3.0.2",
    "myst-parser>=4.0.0",
]

[tool.uv.sources]
# Package sources can be specified here if needed
# e.g., my-package = { git = "https://github.com/user/repo" }
