# extract/pbd_core/pfc_hashes.yaml
# Placeholder for SHA-1 hashes of stock PowerBuilder Foundation Classes (PFC) objects.
# Each entry should be the SHA-1 hash of the object's canonical content.
# Format: List of strings or a mapping if more metadata per hash is needed later.

# Example (these are NOT real PFC hashes):
# - "da39a3ee5e6b4b0d3255bfef95601890afd80709"  # Example: empty string hash for pfc_n_cst_winsrv.sru
# - "a1b2c3d4e5f60708090a0b0c0d0e0f1011121314"  # Example: for pfc_w_master.srw

# Actual hashes would be generated by processing PFC libraries and calculating SHA-1
# on the extracted raw_text_content (UTF-8 encoded for text objects) or raw_binary_content.

# For initial testing, keep it minimal or empty.
pfc_object_sha1_hashes:
  - "examplehash1placeholderxxxxxxxxxxxxxxx"
  - "examplehash2placeholderxxxxxxxxxxxxxxx" 